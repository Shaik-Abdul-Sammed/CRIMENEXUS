  <!-- Scorpio Getaway Vehicle Silhouette -->
  <path d="M160 270 L200 170 L400 170 L440 270 L470 290 L470 330 L430 330 C430 305 380 305 380 330 L220 330 C220 305 170 305 170 330 L130 330 L130 290 Z" fill="#0f172a" stroke="#475569" stroke-width="2"/>
  <!-- Tail lights -->
  <rect x="150" y="260" width="45" height="18" rx="4" fill="#ef4444" filter="drop-shadow(0 0 8px #ef4444)"/>
  <rect x="405" y="260" width="45" height="18" rx="4" fill="#ef4444" filter="drop-shadow(0 0 8px #ef4444)"/>
  <!-- ANPR Recognition Box -->
