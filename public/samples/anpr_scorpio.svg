  <text x="240" y="300" fill="#000000" font-family="monospace" font-size="18" font-weight="900" letter-spacing="2">DL 10 CK 4492</text>
  <circle cx="236" cy="277" r="3" fill="#1d4ed8"/>
  <text x="234" y="279" fill="#ffffff" font-family="sans-serif" font-size="3" font-weight="bold">IND</text>
  <!-- Optical ANPR Overlay Header -->
