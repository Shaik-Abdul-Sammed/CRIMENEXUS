      <stop offset="0%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#anpr-bg)"/>
  <!-- Highway asphalt & lane markings -->
  <path d="M0 400 L220 200 L380 200 L600 400 Z" fill="#1e293b"/>
