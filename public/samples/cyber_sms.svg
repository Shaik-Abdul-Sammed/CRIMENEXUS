<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="phone-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="#030712"/>
  <!-- Smartphone Screen Body -->
  <rect x="150" y="20" width="300" height="360" rx="30" fill="url(#phone-bg)" stroke="#3f3f46" stroke-width="3"/>
  <rect x="250" y="30" width="100" height="15" rx="7.5" fill="#27272a"/>
  <!-- Status bar -->
  <text x="180" y="42" fill="#a1a1aa" font-family="sans-serif" font-size="9" font-weight="bold">14:15</text>
  <text x="410" y="42" fill="#a1a1aa" font-family="sans-serif" font-size="9" font-weight="bold">5G 92%</text>
  <!-- App Header -->
  <rect x="160" y="55" width="280" height="40" rx="10" fill="#27272a"/>
  <circle cx="185" cy="75" r="14" fill="#ef4444"/>
  <text x="180" y="80" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="bold">!</text>
  <text x="210" y="73" fill="#fafafa" font-family="sans-serif" font-size="12" font-weight="bold">VM-POWER-DISPATCH</text>
  <text x="210" y="86" fill="#a1a1aa" font-family="sans-serif" font-size="9">Urgent Regulatory Notice</text>
  <!-- Phishing SMS Message Bubble -->
  <rect x="175" y="110" width="250" height="140" rx="14" fill="#3f3f46" fill-opacity="0.6" stroke="#ef4444" stroke-width="1.5"/>
  <text x="190" y="132" fill="#f87171" font-family="sans-serif" font-size="11" font-weight="bold">ELECTRICITY NOTICE #908122:</text>
  <text x="190" y="152" fill="#e4e4e7" font-family="sans-serif" font-size="10">Dear Consumer, your power will be</text>
  <text x="190" y="168" fill="#e4e4e7" font-family="sans-serif" font-size="10">disconnected tonight at 21:30 PM due to</text>
  <text x="190" y="184" fill="#e4e4e7" font-family="sans-serif" font-size="10">previous month bill update pending.</text>
  <text x="190" y="208" fill="#38bdf8" font-family="sans-serif" font-size="10" text-decoration="underline">http://bses-delhi-bill.xyz/pay.apk</text>
  <text x="190" y="232" fill="#a1a1aa" font-family="sans-serif" font-size="8">14:12 PM • Delivered via GSM SMS</text>
  <!-- Forensics Badge -->
  <rect x="175" y="270" width="250" height="85" rx="10" fill="#450a0a" stroke="#dc2626" stroke-width="1.5"/>
  <text x="190" y="292" fill="#fca5a5" font-family="monospace" font-size="11" font-weight="bold">CYBER FRAUD ANALYSIS</text>
  <text x="190" y="310" fill="#fecaca" font-family="sans-serif" font-size="9">• Domain bses-delhi-bill.xyz hosted in Russia</text>
  <text x="190" y="325" fill="#fecaca" font-family="sans-serif" font-size="9">• Dropper: Trojan-Banker.AndroidOS.Agent</text>
  <text x="190" y="340" fill="#86efac" font-family="monospace" font-size="9">Mule Acc Linked: HDFC-908122 (₹45,000)</text>
</svg>