version: "3.8"

services:
  osrm:
    image: osrm/osrm-backend:latest
    container_name: crimenexus_osrm
    restart: unless-stopped
    ports:
      - "5000:5000"
    command: osrm-routed --algorithm mld /data/delhi-ncr-latest.osrm
    volumes:
      - ./backend/data/osrm:/data
    networks:
      - crimenexus_prod_net

  backend:
    environment:
      - OSRM_BASE_URL=http://osrm:5000
    depends_on:
      - osrm

networks:
  crimenexus_prod_net:
    name: crimenexus_crimenexus_prod_net
    external: true
