name: CRIMENEXUS CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-verification:
    name: Backend Security & E2E Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: crimenexus
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      neo4j:
        image: neo4j:5.24-community
        env:
          NEO4J_AUTH: neo4j/crimenexus123
        ports:
          - 7687:7687
          - 7474:7474
        options: >-
          --health-cmd "cypher-shell -u neo4j -p crimenexus123 'RETURN 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/crimenexus
      POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/crimenexus
      NEO4J_URI: bolt://localhost:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: crimenexus123
      JWT_SECRET_KEY: crimenexus_super_secure_ci_test_key_minimum_32_characters_2026
      ENVIRONMENT: test

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: Install System Dependencies (libpq)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpq-dev build-essential

      - name: Install Backend Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Seed Initial Syndicate Graph & PostgreSQL Schemas
        run: |
          PYTHONPATH=backend python backend/seed_demo_data.py

      - name: Run Forensic & Security Test Suite (PyTest)
        run: |
          PYTHONPATH=backend pytest \
            backend/test_enterprise_e2e.py \
            backend/test_fir_automation.py \
            backend/test_financial_tripwire.py \
            -v

  frontend-verification:
    name: Frontend Lint, Unit Tests & Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Run ESLint Code Quality Check
        run: npm run lint

      - name: Run Vitest Unit & Integration Tests
        run: npm run test -- --run

      - name: Compile Production Build (Vite & TypeScript)
        run: npm run build
