services:
  # 1. CRIMENEXUS Backend (FastAPI + PyTorch/ONNX + OpenCV + NetworkX)
  - type: web
    name: crimenexus-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: singapore
    healthCheckPath: /api/v1/ml/status
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: crimenexus-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: crimenexus-redis
          property: connectionString
      - key: NEO4J_URI
        sync: false
      - key: NEO4J_USER
        value: neo4j
      - key: NEO4J_PASSWORD
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: CCTNS_API_KEY
        sync: false
      - key: ENVIRONMENT
        value: production
      - key: OLLAMA_BASE_URL
        sync: false

  # 2. CRIMENEXUS Frontend (React 19 + TypeScript + Vite + Tailwind CSS + Cytoscape)
  - type: web
    name: crimenexus-frontend
    runtime: static
    plan: free
    region: singapore
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://crimenexus-backend.onrender.com

  # 3. CRIMENEXUS Redis Stream Broker & In-Memory Hot Cache
  - type: redis
    name: crimenexus-redis
    plan: free
    region: singapore
    ipAllowList: []

databases:
  # Managed PostgreSQL Relational & Spatial Database
  - name: crimenexus-postgres
    plan: free
    region: singapore
    databaseName: crimenexus
    user: crimenexus_admin
