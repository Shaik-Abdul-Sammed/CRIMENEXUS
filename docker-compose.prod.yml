services:
  postgres:
    image: postgres:15-alpine
    container_name: crimenexus_postgres_prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-crimenexus}
    # STRICT ZERO-TRUST: No host port mapping. Accessible strictly within internal Docker bridge.
    expose:
      - "5432"
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-crimenexus}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - crimenexus_prod_net

  neo4j:
    image: neo4j:5.24-community
    container_name: crimenexus_neo4j_prod
    restart: always
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-crimenexus123}
      NEO4J_PLUGINS: '["apoc"]'
    # STRICT ZERO-TRUST: No host port mapping. Accessible strictly within internal Docker bridge.
    expose:
      - "7474"
      - "7687"
    volumes:
      - neo4j_data_prod:/data
      - neo4j_logs_prod:/logs
    networks:
      - crimenexus_prod_net

  redis:
    image: redis:7-alpine
    container_name: crimenexus_redis_prod
    restart: always
    command: redis-server --appendonly yes
    # STRICT ZERO-TRUST: Internal network only, no public host port exposure
    expose:
      - "6379"
    volumes:
      - redis_data_prod:/data
    networks:
      - crimenexus_prod_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: crimenexus_backend_prod
    restart: always
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-crimenexus}
      - POSTGRES_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-crimenexus}
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=${NEO4J_USER:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-crimenexus123}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-crimenexus_super_secure_jwt_secret_key_change_in_prod_2026}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-15}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - ENVIRONMENT=production
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_started
      redis:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M
        reservations:
          cpus: '0.5'
          memory: 512M
    networks:
      - crimenexus_prod_net

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: crimenexus_frontend_prod
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - crimenexus_prod_net

networks:
  crimenexus_prod_net:
    driver: bridge

volumes:
  postgres_data_prod:
  neo4j_data_prod:
  neo4j_logs_prod:
  redis_data_prod:
